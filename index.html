<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100a2a">
  <meta name="description" content="A Women in STEM quiz game with ten questions, lifelines and a leaderboard.">
  <title>STEM Millionaire | Women in STEM Quiz</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="STEM Millionaire home"><span class="brand-star">✦</span><span>STEM<span class="brand-light">MILLIONAIRE</span></span></a>
      <button id="leaderboardToggle" class="top-link" type="button">🏆 <span>Leaderboard</span></button>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer class="footer"><span>WOMEN IN STEM EDITION</span><span>Knowledge is your superpower ✦</span></footer>
  </div>
  <dialog id="leaderboardDialog" class="leaderboard-dialog" aria-labelledby="leaderboardTitle">
    <div class="dialog-head"><div><span class="eyebrow">HALL OF FAME</span><h2 id="leaderboardTitle">Leaderboard</h2></div><button id="closeLeaderboard" class="icon-button" type="button" aria-label="Close leaderboard">×</button></div>
    <div id="leaderboardContent"></div>
  </dialog>
</body>
</html>
